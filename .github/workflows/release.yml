name: Build & Package (macOS & Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'install_and_build.sh'
      - 'packaging/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  IMAGO_CACHE_REV: cd44e67-v1
  QT_VER: '6.8.3'

jobs:
  macos-arm64:
    name: macOS arm64 (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt & Ninja via Homebrew
        run: brew install qt ninja

      - name: Cache built Imago (macOS arm64)
        uses: actions/cache@v4
        with:
          path: imago
          key: imago-macos-arm64-${{ env.IMAGO_CACHE_REV }}

      - name: Fetch Indigo & build Imago
        run: |
          packaging/macos/fetch_indigo.sh
          packaging/macos/build_imago.sh

      - name: Configure, build & test
        run: |
          cmake -S . -B build_mac -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_mac
          QT_QPA_PLATFORM=offscreen ctest --test-dir build_mac --output-on-failure -j "$(sysctl -n hw.logicalcpu)"

      - name: Package .app & .dmg
        run: |
          packaging/macos/make_app.sh build_mac
          packaging/macos/make_dmg.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtSketch-macos-arm64
          path: |
            dist/QtSketch-*.dmg
            dist/QtSketch-*.dmg.sha256

  linux-appimage:
    name: Linux ${{ matrix.arch }} (.AppImage)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            aqt_host: linux
            aqt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            aqt_host: linux_arm64
            aqt_arch: linux_gcc_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl ca-certificates file patchelf \
            desktop-file-utils squashfs-tools zsync libfuse2t64 \
            python3 python3-pip python3-venv \
            libgl1-mesa-dev libopengl0 libglx0 libegl1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libx11-xcb1 libxrender1 libxi6 libsm6 libice6 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Cache Qt ${{ env.QT_VER }} (Linux ${{ matrix.arch }})
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-${{ env.QT_VER }}-linux-${{ matrix.arch }}-v1

      - name: Install Qt ${{ env.QT_VER }} via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .aqt-venv
          .aqt-venv/bin/pip install --no-cache-dir aqtinstall
          .aqt-venv/bin/aqt install-qt -O .qt "${{ matrix.aqt_host }}" desktop "${{ env.QT_VER }}" "${{ matrix.aqt_arch }}" -m qtshadertools

      - name: Cache built Imago (Linux ${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: imago
          key: imago-linux-${{ matrix.arch }}-${{ env.IMAGO_CACHE_REV }}

      - name: Fetch Indigo & build Imago
        run: |
          packaging/linux/fetch_indigo.sh
          packaging/linux/build_imago.sh

      - name: Configure, build, test & package AppImage
        run: |
          QT_DIR="$(echo "$PWD/.qt/${QT_VER}"/gcc_*)"
          export PATH="$QT_DIR/bin:$PATH"
          export QMAKE="$QT_DIR/bin/qmake"
          cmake -S . -B build_linux -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_linux
          QT_QPA_PLATFORM=offscreen ctest --test-dir build_linux --output-on-failure -j "$(nproc)"
          packaging/linux/make_appimage.sh build_linux

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtSketch-linux-${{ matrix.arch }}
          path: |
            dist/QtSketch-*.AppImage
            dist/QtSketch-*.AppImage.sha256

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, linux-appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/QtSketch-*.dmg
            release-assets/QtSketch-*.dmg.sha256
            release-assets/QtSketch-*.AppImage
            release-assets/QtSketch-*.AppImage.sha256
